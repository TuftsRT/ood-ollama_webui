description: |
  The Research Chatbot provides a chat interface to open-source large language models (LLMs), similar to ChatGPT, making it easy to explore generative AI models without coding. This is meant for beginners and educators who want to experiment with conversational models for classroom or research use. This tool not meant for personal use. You can find more information on the models available [here](https://tufts.box.com/v/ResearchChatbotModels).
